[package]
name = "nullwarden-server"
version = "0.1.0"
edition = "2021"
license = { workspace = true }

[dependencies]
anyhow = { workspace = true }
async-trait = "0.1"
argon2 = "0.5"
axum = "0.7"
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
chrono = { version = "0.4", features = ["clock"] }
constant_time_eq = "0.3"
envy = "0.4"
governor = "0.6"
jsonwebtoken = "9"
sha2 = "0.10"
hex = "0.4"
serde = { workspace = true }
serde_json = "1"
sqlx = { package = "sqlx-core", version = "=0.8.6", default-features = false, features = ["_rt-tokio", "_tls-rustls-ring-webpki", "uuid", "chrono", "migrate"] }
sqlx-postgres = { version = "=0.8.6", default-features = false, features = ["uuid", "chrono", "migrate"] }
thiserror = { workspace = true }
tokio = { workspace = true }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["set-header", "request-id", "util", "cors"] }
tower_governor = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }
uuid = { workspace = true }
nullwarden-core = { version = "0.1.0", path = "../nullwarden-core" }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
