[package]
name = "nullwarden-cli"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = { workspace = true }
arboard = "3"
clap = { version = "4", features = ["derive"] }
dirs = "5"
keyring = "2"
nullwarden-core = { path = "../nullwarden-core" }
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }
rpassword = "7"
serde = { workspace = true }
serde_json = "1.0"
tokio = { workspace = true }
toml = "0.8"
zxcvbn = "3"
thiserror = { workspace = true }

[dev-dependencies]
tempfile = "3"
