name: ci
on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build workspace
        run: cargo build --workspace
      - name: Run unit tests
        run: cargo test --workspace
      - name: KDF latency gate
        run: cargo test -p nullwarden-core -- --ignored kdf_meets_minimum_latency

      - name: Install tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny,cargo-tarpaulin

      - name: Audit dependencies
        run: cargo audit
      - name: Deny policy check
        run: cargo deny check
      - name: Coverage gate
        run: |
          cargo tarpaulin -p nullwarden-core --fail-under 80
          cargo tarpaulin -p nullwarden-server --fail-under 60

  miri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - run: cargo +nightly miri setup
      - run: cargo +nightly miri test -p nullwarden-core
