version: "3.9"
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: nullwarden
      POSTGRES_PASSWORD: password
      POSTGRES_DB: nullwarden
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  server:
    # WARNING: .env.example is for development only. 
    # For production, create a private .env file and update this path.
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - postgres
    env_file:
      - .env.example
    ports:
      - "8080:8080"

volumes:
  postgres-data:
