version: "3.9"
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: nullwarden
      POSTGRES_PASSWORD: password
      POSTGRES_DB: nullwarden
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nullwarden -d nullwarden"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    # WARNING: .env.example is for development only. 
    # For production, create a private .env file and update this path.
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "8080:8080"

volumes:
  postgres-data:
