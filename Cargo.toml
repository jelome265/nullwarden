[workspace]
members = [
    "crates/nullwarden-core",
    "crates/nullwarden-cli",
    "crates/nullwarden-server",
    "crates/nullwarden-fuzz",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
thiserror = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["serde", "v4"] }
windows-sys = "0.61.2"
windows-targets = "0.53.5"

