[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
ignore = []

[licenses]
allow = ["MIT", "Apache-2.0", "BSD-3-Clause", "ISC", "MIT-0", "BSL-1.0", "Zlib", "Unicode-3.0", "NCSA", "MPL-2.0", "CDLA-Permissive-2.0"]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
skip = [
    { name = "getrandom", version = "0.2.17" },
    { name = "getrandom", version = "0.3.4" },
    { name = "getrandom", version = "0.4.2" },
    { name = "hashbrown", version = "0.14.5" },
    { name = "hashbrown", version = "0.15.5" },
    { name = "hashbrown", version = "0.17.0" },
    { name = "r-efi", version = "5.3.0" },
    { name = "r-efi", version = "6.0.0" },
    { name = "redox_syscall", version = "0.5.18" },
    { name = "redox_syscall", version = "0.7.4" },
    { name = "thiserror", version = "1.0.69" },
    { name = "thiserror", version = "2.0.18" },
    { name = "thiserror-impl", version = "1.0.69" },
    { name = "thiserror-impl", version = "2.0.18" },
    { name = "windows_i686_gnu", version = "0.53.1" },
    { name = "windows_i686_gnullvm", version = "0.52.6" },
    { name = "windows_i686_gnullvm", version = "0.53.1" },
    { name = "windows_i686_msvc", version = "0.48.5" },
    { name = "windows_i686_msvc", version = "0.52.6" },
    { name = "windows_i686_msvc", version = "0.53.1" },
    { name = "windows_x86_64_gnu", version = "0.48.5" },
    { name = "windows_x86_64_gnu", version = "0.52.6" },
    { name = "windows_x86_64_gnu", version = "0.53.1" },
    { name = "windows_x86_64_gnullvm", version = "0.48.5" },
    { name = "windows_x86_64_gnullvm", version = "0.52.6" },
    { name = "windows_x86_64_gnullvm", version = "0.53.1" },
    { name = "windows_x86_64_msvc", version = "0.48.5" },
    { name = "windows_x86_64_msvc", version = "0.52.6" },
    { name = "windows_x86_64_msvc", version = "0.53.1" },
    { name = "wit-bindgen", version = "0.51.0" },
    { name = "wit-bindgen", version = "0.57.1" },
    { name = "windows-sys", version = "0.45.0" },
