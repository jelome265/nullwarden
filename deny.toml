    { name = "windows-targets", version = "0.48.5" },
    { name = "windows-targets", version = "0.52.6" },
    { name = "windows-targets", version = "0.53.5" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
