openapi: 3.1.0
info:
  title: NullWarden API
  version: 0.1.0
paths:
  /health:
    get:
      responses:
        "200":
          description: OK
  /auth/register:
    post:
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        "201":
          description: Successfully registered
  /auth/login:
    post:
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        "200":
          description: Successfully logged in
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  refresh_token:
                    type: string
  /auth/refresh:
    post:
      summary: Refresh Access Token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
      responses:
        "200":
          description: Refreshed tokens
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  refresh_token:
                    type: string
  /auth/logout:
    post:
      summary: Logout
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
      responses:
        "204":
          description: Successfully logged out
  /auth/user:
    delete:
      summary: Delete the authenticated user account
      security:
        - bearerAuth: []
      responses:
        "204":
          description: User deleted and dependent data removed
  /vault:
    get:
      summary: Get user vault
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Vault binary data
          headers:
            X-Vault-Version:
              schema:
                type: integer
          content:
            application/octet-stream: {}
    put:
      summary: Update user vault
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: X-If-Match
          required: false
          schema:
            type: integer
        - in: header
          name: X-Force
          required: false
          schema:
            type: boolean
      requestBody:
        required: true
        content:
          application/octet-stream: {}
      responses:
        "200":
          description: Vault successfully updated
        "409":
          description: Conflict (version mismatch)
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
